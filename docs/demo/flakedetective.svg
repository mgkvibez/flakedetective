<svg xmlns="http://www.w3.org/2000/svg" width="1016" height="544" viewBox="0 0 1016 544" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">
  <rect width="1016" height="544" rx="10" fill="#0d1117"/>
  <rect width="1016" height="34" rx="10" fill="#161b22"/>
  <rect y="24" width="1016" height="10" fill="#161b22"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/>
<text x="24" y="58" fill="#7ee787" font-weight="bold" xml:space="preserve">$ flakedetective run --runs 6 -- pytest -q</text>
<text x="24" y="80" fill="#c9d1d9" font-weight="normal" xml:space="preserve"></text>
<text x="24" y="102" fill="#d2a8ff" font-weight="normal" xml:space="preserve">flakedetective: 6 run(s), 1 flaky, 1 always-failing</text>
<text x="24" y="124" fill="#c9d1d9" font-weight="normal" xml:space="preserve"></text>
<text x="24" y="146" fill="#c9d1d9" font-weight="normal" xml:space="preserve">Flaky (passed and failed)</text>
<text x="24" y="168" fill="#ff7b72" font-weight="normal" xml:space="preserve">  [######......] 50% 3/6 runs  tests/test_cart.py::test_total</text>
<text x="24" y="190" fill="#d29922" font-weight="normal" xml:space="preserve">     likely network: depends on something outside the process</text>
<text x="24" y="212" fill="#d29922" font-weight="normal" xml:space="preserve">     prove it: for i in 1 2 3 4 5; do pytest &quot;tests/test_cart.py::test_total&quot; -q || echo &quot;FAILED on attempt $i&quot;; done</text>
<text x="24" y="234" fill="#c9d1d9" font-weight="normal" xml:space="preserve"></text>
<text x="24" y="256" fill="#c9d1d9" font-weight="normal" xml:space="preserve">Always failing (not flaky, just broken)</text>
<text x="24" y="278" fill="#c9d1d9" font-weight="normal" xml:space="preserve">  6/6 runs  tests/test_auth.py::test_login</text>
<text x="24" y="300" fill="#c9d1d9" font-weight="normal" xml:space="preserve"></text>
<text x="24" y="322" fill="#58a6ff" font-weight="normal" xml:space="preserve">Quarantine (copy, then fix one per PR):</text>
<text x="24" y="344" fill="#8b949e" font-weight="normal" xml:space="preserve"># pytest.ini / pyproject.toml [tool.pytest.ini_options]</text>
<text x="24" y="366" fill="#8b949e" font-weight="normal" xml:space="preserve"># Quarantined 1 test(s). Remove each line as it is fixed.</text>
<text x="24" y="388" fill="#c9d1d9" font-weight="normal" xml:space="preserve">[tool.pytest.ini_options]</text>
<text x="24" y="410" fill="#8b949e" font-weight="normal" xml:space="preserve">addopts = [</text>
<text x="24" y="432" fill="#8b949e" font-weight="normal" xml:space="preserve">    &quot;--deselect=tests/test_cart.py::test_total&quot;,</text>
<text x="24" y="454" fill="#c9d1d9" font-weight="normal" xml:space="preserve">]</text>
<text x="24" y="476" fill="#c9d1d9" font-weight="normal" xml:space="preserve"></text>
<text x="24" y="498" fill="#c9d1d9" font-weight="normal" xml:space="preserve">A flaky test is a fact (it both passed and failed). A cause is a hypothesis from the failure text until you reproduce it.</text>
</svg>
